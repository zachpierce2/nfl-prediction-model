name: NFL Save Pregame Forecast

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nfl-manual-market-quotes
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r requirements-market.txt

      - name: Save prospective forecasts
        run: python forecast_saved_quotes.py

      - name: Commit forecast archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market_forecasts.csv
          if git diff --cached --quiet; then
            echo "No new forecasts"
          else
            git commit -m "Save prospective market-model forecasts"
            git push
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: nfl-pregame-forecasts
          path: data/market_forecasts.csv
