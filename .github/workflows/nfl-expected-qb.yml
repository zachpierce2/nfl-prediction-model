name: NFL Expected QB Validation
on:
  pull_request:
    paths:
      - qb_expected.py
      - expected_qb_shadow.py
      - qb_passing.py
      - auto_market.py
      - grade_market.py
      - test_qb_expected.py
      - .github/workflows/nfl-auto-market.yml
      - .github/workflows/nfl-grade-market.yml
      - .github/workflows/nfl-expected-qb.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-market.txt
      - run: python -m pip install -r requirements-market.txt
      - run: python -m unittest -v test_qb_expected test_qb_passing test_qb_announcements test_qb_market test_qb_news test_epa_shadow test_advanced_shadow
      - run: python grade_market.py --self-test
