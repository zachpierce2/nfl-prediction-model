name: NFL EPA Error Audit
on:
  pull_request:
    paths:
      - epa_error_audit.py
      - test_epa_error_audit.py
      - epa_targeted_correction.py
      - test_epa_targeted_correction.py
      - .github/workflows/nfl-epa-error-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-market.txt
      - run: pip install -r requirements-market.txt
      - run: python -m unittest -v test_epa_error_audit test_epa_targeted_correction
      - run: python epa_error_audit.py
      - run: python epa_targeted_correction.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nfl-epa-error-audit-results
          path: epa_error_audit_results/
          if-no-files-found: warn
