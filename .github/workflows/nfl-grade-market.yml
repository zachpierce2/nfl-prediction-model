name: NFL Automatic Grading

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/nfl-grade-market.yml
      - grade_market.py
  schedule:
    - cron: '43 9 * * *'

permissions:
  contents: write

concurrency:
  group: nfl-manual-market-quotes
  cancel-in-progress: false

jobs:
  grade:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-market.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-market.txt

      - name: Validate paired EPA tracking
        run: python -m unittest -v test_kalshi_paper test_consensus_shadow test_primary_timing.py test_epa_shadow.py test_advanced_shadow.py test_qb_market.py test_qb_passing.py test_qb_expected.py test_qb_starter_comparison.py

      - name: Validate line comparison
        run: python grade_market.py --self-test

      - name: Grade completed games
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python grade_market.py

      - name: Publish primary market + EPA output
        run: python publish_primary.py grade

      - name: Kalshi paper grade
        run: python kalshi_paper.py grade

      - name: Save grading reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/auto_market/kalshi_paper/ data/auto_market/consensus_shadow/ data/auto_market/primary/ data/auto_market/total_shadow/ data/auto_market/qb_starter_comparison/ data/auto_market/expected_qb_shadow/ data/auto_market/grading/ data/auto_market/epa_shadow/ data/auto_market/advanced_shadow/ data/auto_market/qb_passing_shadow/
          if git diff --cached --quiet; then
            echo "No grading changes"
          else
            git commit -m "Grade saved NFL market forecasts"
            git push
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: nfl-market-grading-results
          path: |
            data/auto_market/primary/
            data/auto_market/grading/
            data/auto_market/epa_shadow/
            data/auto_market/advanced_shadow/
            data/auto_market/qb_passing_shadow/
            data/auto_market/expected_qb_shadow/
            data/auto_market/qb_starter_comparison/
