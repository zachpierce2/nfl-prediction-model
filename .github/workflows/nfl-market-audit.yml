name: NFL Market Model Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r audit-requirements.txt

      - name: Run chronological audit
        run: python audit_market_model.py --games audit_games_snapshot.csv --out audit_results

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: nfl-market-model-audit
          path: audit_results/
