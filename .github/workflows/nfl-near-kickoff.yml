name: NFL Near-Kickoff Quotes
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/nfl-near-kickoff.yml]
  schedule:
    - cron: '8,38 0-5,13-23 * * *'
permissions:
  contents: write
concurrency:
  group: nfl-near-kickoff-quotes
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: gate
        run: echo "due=$(python near_kickoff.py --check)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.due == 'yes'
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-market.txt
      - if: steps.gate.outputs.due == 'yes'
        run: python -m pip install -r requirements-market.txt
      - if: steps.gate.outputs.due == 'yes'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python near_kickoff.py
      - if: steps.gate.outputs.due == 'yes'
        run: |
          if [ -f data/auto_market/near_kickoff/quotes.csv ]; then
            git add data/auto_market/near_kickoff/quotes.csv
            if ! git diff --cached --quiet; then
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git commit -m 'Save same-book near-kickoff observations'
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
