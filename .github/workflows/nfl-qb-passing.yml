name: NFL QB Passing EPA Experiment
on:
  workflow_dispatch:
  pull_request:
    paths:
      - qb_passing.py
      - test_qb_passing.py
      - auto_market.py
      - .github/workflows/nfl-qb-passing.yml
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-market.txt
      - name: Verify QB features and pregame boundaries
        run: python -m unittest -v test_qb_passing test_qb_market test_epa_shadow
      - uses: actions/cache@v4
        with:
          path: qb_passing_cache
          key: qb-passing-v1-2017-2025
      - name: Run fixed prior-season comparisons
        run: python qb_passing.py
      - name: Write comparison summary
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path('qb_passing_results/summary.json').read_text())
          lines=['## QB passing experiment, 2021–2025','',
            '| Method | Wins | Losses | Pushes | ATS win rate |',
            '|---|---:|---:|---:|---:|']
          for row in r['results']:
              if row['period']=='all':
                  lines.append('| {} | {} | {} | {} | {:.2f}% |'.format(
                      row['method'],row['hypothetical_wins'],row['hypothetical_losses'],
                      row['hypothetical_pushes'],row['hypothetical_win_pct']))
          lines+=['','Development evidence only. Actual-starter arm uses retrospective identities.']
          text='\n'.join(lines)
          print(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write(text+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qb-passing-results
          path: qb_passing_results/
          if-no-files-found: error
