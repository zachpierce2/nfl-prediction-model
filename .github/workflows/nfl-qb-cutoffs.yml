name: NFL QB timing and Kalshi quotes
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/nfl-qb-cutoffs.yml]
  schedule:
    - cron: '7,37 * * 1,9-12 *'
permissions:
  contents: write
concurrency:
  group: nfl-qb-cutoff-archive
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check kickoff windows and grade completed games
        id: gate
        run: python3 qb_cutoff_tracker.py gate
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.active == 'true'
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-market.txt
      - name: Install collector dependencies
        if: steps.gate.outputs.active == 'true'
        run: python -m pip install -r requirements-market.txt
      - name: Refresh official starter announcements
        if: steps.gate.outputs.active == 'true'
        continue-on-error: true
        run: python collect_qb_inputs.py
      - name: Freeze QB evidence and public quotes
        if: steps.gate.outputs.active == 'true'
        run: python qb_cutoff_tracker.py capture
      - name: Publish timing archive
        if: always() && steps.gate.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/auto_market/qb_cutoffs/
          if ! git diff --cached --quiet; then
            git commit -m "Archive NFL QB timing observations"
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
              sleep 2
            done
            exit 1
          fi
