name: NFL Direct Cover Probability Experiment

on:
  workflow_dispatch:
  push:
    branches: ['experiment/direct-cover-probability']
    paths:
      - 'market_cover_probability.py'
      - 'market_model.py'
      - '*cover*experiment*.py'
      - 'verify_cover_probability.py'
      - 'requirements-cover.txt'
      - 'strength_games_snapshot.csv'
      - 'strength_epa_features.csv'
      - 'strength_epa_reference_predictions.csv'
      - '.github/workflows/nfl-direct-cover.yml'
  pull_request:
    paths:
      - 'market_cover_probability.py'
      - 'market_model.py'
      - '*cover*experiment*.py'
      - 'verify_cover_probability.py'
      - 'requirements-cover.txt'
      - 'strength_games_snapshot.csv'
      - 'strength_epa_features.csv'
      - 'strength_epa_reference_predictions.csv'
      - '.github/workflows/nfl-direct-cover.yml'

permissions:
  contents: read

concurrency:
  group: direct-cover-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-cover.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-cover.txt
      - name: Verify walk-forward boundaries and baseline reproduction
        run: python -m unittest -v verify_cover_probability.py test_direct_cover_experiment.py
      - name: Run frozen historical backtest
        run: python market_cover_probability.py --out cover_probability_results
      - name: Add results to run summary
        run: cat cover_probability_results/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Record environment
        run: |
          python -m pip freeze > cover_probability_results/environment.txt
          git rev-parse HEAD > cover_probability_results/commit.txt
      - name: Upload backtest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-direct-cover-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: cover_probability_results/
          if-no-files-found: error
          retention-days: 30
