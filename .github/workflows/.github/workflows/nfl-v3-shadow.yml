name: NFL V3 Candidate Comparison

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Test, record forecasts, or evaluate recorded games
        type: choice
        default: test
        options:
          - test
          - forecast
          - evaluate

permissions:
  contents: write

concurrency:
  group: nfl-advanced-data-archive
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify and extract comparison tools
        run: |
          echo '3146b18b14c9c8408f88b7b2de9c1c3ca875f1a70c12ab26a835c66709f77228  nfl_v3_shadow_tools.zip' | sha256sum --check --strict
          python -m zipfile -e nfl_v3_shadow_tools.zip comparison_tools
          echo '96ace67f6de8ccb045aaf97ed3a0d2193b065100cba92640914eec45e26b541d  nfl_advanced_data_auto.zip' | sha256sum --check --strict
          python -m zipfile -e nfl_advanced_data_auto.zip advanced_tools
          python comparison_tools/verify.py
          python advanced_tools/verify.py

      - name: Install model dependencies
        run: python -m pip install -r comparison_tools/requirements.txt

      - name: Run comparison and replay tests
        run: python -m unittest discover -s comparison_tools -v

      - name: Open existing data archive
        if: inputs.mode != 'test'
        run: |
          git fetch --depth=1 origin refs/heads/nfl-data-archive
          git worktree add --detach "$RUNNER_TEMP/nfl-data-archive" FETCH_HEAD

      - name: Record fresh odds
        if: inputs.mode == 'forecast'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python advanced_tools/odds.py --out nfl_shadow_results/capture

      - name: Prepare schedule and source inputs
        if: inputs.mode == 'forecast'
        run: >-
          python advanced_tools/data_layer.py
          --capture nfl_shadow_results/capture
          --archive "$RUNNER_TEMP/nfl-data-archive/data"
          --inputs nfl_data_inputs
          --out nfl_shadow_results/availability

      - name: Collect automatic reports
        if: inputs.mode == 'forecast'
        run: >-
          python advanced_tools/auto_reports.py
          --availability nfl_shadow_results/availability
          --out nfl_shadow_results/auto_reports

      - name: Record forecasts and update comparison
        if: inputs.mode == 'forecast'
        run: >-
          python comparison_tools/shadow_compare.py
          --data nfl_shadow_results
          --archive "$RUNNER_TEMP/nfl-data-archive"
          --out nfl_shadow_results/comparison

      - name: Evaluate recorded forecasts without new odds
        if: inputs.mode == 'evaluate'
        run: >-
          python comparison_tools/shadow_compare.py
          --evaluate
          --archive "$RUNNER_TEMP/nfl-data-archive"
          --out nfl_shadow_results/comparison

      - name: Preserve data and prediction ledger
        if: always() && inputs.mode != 'test'
        shell: bash
        run: |
          if [ -f nfl_shadow_results/capture/capture.json ]; then
            python -c 'import sys,os; sys.path.insert(0,"advanced_tools"); from data_layer import archive_capture; archive_capture("nfl_shadow_results/capture",os.environ["RUNNER_TEMP"]+"/nfl-data-archive/data")'
            if [ -d nfl_shadow_results/auto_reports ]; then
              mkdir -p "$RUNNER_TEMP/nfl-data-archive/data/auto_reports"
              cp -a nfl_shadow_results/auto_reports "$RUNNER_TEMP/nfl-data-archive/data/auto_reports/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            fi
          fi
          if [ -f nfl_shadow_results/comparison/manifest.json ]; then
            if [ -f nfl_shadow_results/comparison/game_predictions.csv ]; then
              target=shadow_predictions
            else
              target=shadow_evaluations
            fi
            mkdir -p "$RUNNER_TEMP/nfl-data-archive/data/$target"
            cp -a nfl_shadow_results/comparison "$RUNNER_TEMP/nfl-data-archive/data/$target/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi
          if [ -d "$RUNNER_TEMP/nfl-data-archive/data" ]; then
            git -C "$RUNNER_TEMP/nfl-data-archive" config user.name 'github-actions[bot]'
            git -C "$RUNNER_TEMP/nfl-data-archive" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git -C "$RUNNER_TEMP/nfl-data-archive" add data
            if ! git -C "$RUNNER_TEMP/nfl-data-archive" diff --cached --quiet; then
              git -C "$RUNNER_TEMP/nfl-data-archive" commit -m "Record V3 shadow comparison ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
              git -C "$RUNNER_TEMP/nfl-data-archive" push origin HEAD:refs/heads/nfl-data-archive
            fi
          fi

      - name: Downloadable comparison results
        if: always() && inputs.mode != 'test'
        uses: actions/upload-artifact@v4
        with:
          name: nfl-v3-shadow-${{ github.run_id }}-${{ github.run_attempt }}
          path: nfl_shadow_results/
          retention-days: 90
          if-no-files-found: warn
