name: NFL QB News Evidence and Coverage
on:
  workflow_dispatch:
  schedule:
    - cron: '7 */3 * * *'
  pull_request:
    paths:
      - qb_news.py
      - qb_announcements.py
      - collect_qb_inputs.py
      - test_qb_news.py
      - test_qb_announcements.py
      - qb_market.py
      - .github/workflows/nfl-auto-market.yml
      - .github/workflows/nfl-qb-news.yml
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-market.txt
      - run: python -m pip install -r requirements-market.txt
      - run: python -m unittest -v test_qb_news test_qb_announcements test_qb_market test_qb_passing
      - name: Collect official news and count verified coverage
        if: github.event_name != 'pull_request'
        run: python collect_qb_inputs.py
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: qb-news-evidence-${{ github.run_id }}
          path: |
            qb_announcement_evidence/
            data/auto_market/qb_announcements/
          retention-days: 90
