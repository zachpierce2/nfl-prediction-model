name: NFL V3 EPA Comparison

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-v3-epa.txt

      - name: Install dependencies
        run: pip install -r requirements-v3-epa.txt

      - name: Check historical boundaries
        run: python -m unittest -v test_v3_epa.py

      - name: Download game data
        run: |
          mkdir -p data
          curl --fail --location --retry 3 https://raw.githubusercontent.com/nflverse/nfldata/master/data/games.csv --output data/games.csv

      - name: Run EPA comparison
        run: python model_v3_epa.py --games data/games.csv --out nfl_v3_epa_results

      - name: Record dependency versions
        run: pip freeze > nfl_v3_epa_results/dependencies.txt

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: nfl-v3-epa-results
          path: nfl_v3_epa_results/
          if-no-files-found: error
