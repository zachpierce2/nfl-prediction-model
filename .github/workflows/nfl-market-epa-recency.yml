name: NFL Market EPA Recency Test

on:
  pull_request:
    paths:
      - market_epa_recency.py
      - test_market_epa_recency.py
      - .github/workflows/nfl-market-epa-recency.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-market.txt

      - name: Install dependencies
        run: pip install -r requirements-market.txt

      - name: Run fixed recency comparison
        run: python market_epa_recency.py

      - name: Verify selection and reproduce previous results
        run: python -m unittest -v test_market_epa_recency.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-market-epa-recency-results
          path: epa_recency_results/
          if-no-files-found: error
