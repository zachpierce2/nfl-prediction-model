name: NFL Automatic Odds and Forecasts

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'

permissions:
  contents: write

concurrency:
  group: nfl-manual-market-quotes
  cancel-in-progress: false

jobs:
  auto-market:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-market.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-market.txt

      - name: Validate paired forecast boundaries
        run: python -m unittest -v test_epa_shadow test_qb_market test_qb_passing test_qb_news test_qb_announcements

      - name: Collect explicit official starter decisions
        id: qb-inputs
        continue-on-error: true
        run: python collect_qb_inputs.py

      - name: Record unavailable starter collector
        if: steps.qb-inputs.outcome == 'failure'
        run: |
          echo 'QB collection failed; only existing manual confirmations are eligible.' >> "$GITHUB_STEP_SUMMARY"

      - name: Check live EPA inputs on manual runs
        if: github.event_name == 'workflow_dispatch'
        run: python epa_shadow.py --validate-live

      - uses: actions/cache@v4
        with:
          path: qb_passing_cache
          key: qb-passing-v1-2017-2025

      - name: Collect odds and save forecasts
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python auto_market.py

      - name: Commit automatic archives
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/auto_market/
          if git diff --cached --quiet; then
            echo "No archive changes"
          else
            git commit -m "Archive automatic NFL odds and forecasts"
            git push
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nfl-auto-market-results
          path: data/auto_market/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qb-announcement-evidence-${{ github.run_id }}
          path: qb_announcement_evidence/
          retention-days: 90
