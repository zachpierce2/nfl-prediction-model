name: NFL Historical Backtest

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download NFL historical data
        run: python download_data.py

      - name: Run NFL historical backtest
        run: python model_v2.py --games data/games.csv --out nfl_model_results

      - name: Save backtest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-backtest-results
          path: |
            nfl_model_results/
            data/games.csv
          if-no-files-found: warn
          retention-days: 30
