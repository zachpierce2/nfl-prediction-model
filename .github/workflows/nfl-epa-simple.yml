name: NFL Simple EPA Prospective Checks
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**.py'
      - .github/workflows/nfl-epa-simple.yml
      - .github/workflows/nfl-auto-market.yml
      - .github/workflows/nfl-grade-market.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-market.txt
      - run: python -m pip install -r requirements-market.txt
      - run: python -m unittest -v test_epa_simple_shadow test_epa_shadow test_advanced_shadow test_qb_market test_qb_passing test_qb_news test_qb_announcements
      - run: python grade_market.py --self-test
