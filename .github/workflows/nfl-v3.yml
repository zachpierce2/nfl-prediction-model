name: NFL V3 Backtest

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-v3.txt

      - name: Install dependencies
        run: pip install -r requirements-v3.txt

      - name: Run V3
        run: python model_v3.py --games data/games.csv --out nfl_v3_results

      - uses: actions/upload-artifact@v4
        with:
          name: nfl-v3-results
          path: nfl_v3_results/
