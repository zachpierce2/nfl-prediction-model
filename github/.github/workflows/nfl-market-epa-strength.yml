name: NFL Market EPA Strength Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: epa-strength-requirements.txt

      - name: Install dependencies
        run: pip install -r epa-strength-requirements.txt

      - name: Run historical strength comparison
        run: python market_epa_strength.py

      - name: Verify selection and reproduce previous results
        run: python -m unittest -v test_market_epa_strength.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-market-epa-strength-results
          path: epa_strength_results/
          if-no-files-found: error
